<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your SerbisyoMo account as a resident or provider.">
  <title>Log in | SerbisyoMo</title>
  <meta name="theme-color" content="#2A3A5C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232A3A5C'/%3E%3Cpath d='M8 15.5 16 8l8 7.5V24h-5v-6h-6v6H8z' fill='%23E07A4F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/storage.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body class="auth-body">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="auth-topbar">
    <a class="brand" href="index.html" translate="no">SerbisyoMo</a>
    <a class="auth-top-link" href="index.html">Back to home</a>
  </header>

  <main id="main" tabindex="-1" class="auth-shell">
    <div class="auth-card-single">
      <div class="auth-card-header">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in to SerbisyoMo</h1>
        <p class="auth-subtitle">Choose your role, then enter your email and password.</p>
      </div>

      <form id="login-form" class="auth-form" method="post" action="#" novalidate>
        <fieldset class="role-toggle">
          <legend class="visually-hidden">Account role</legend>
          <label>
            <input type="radio" name="role" value="resident" checked>
            Resident
          </label>
          <label>
            <input type="radio" name="role" value="provider">
            Provider
          </label>
        </fieldset>

        <div class="auth-field">
          <label for="login-email">Email</label>
          <input
            id="login-email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="username"
            required
            autofocus
            spellcheck="false"
            placeholder="you@example.com"
          >
        </div>

        <div class="auth-field">
          <label for="login-password">Password</label>
          <div class="password-input-wrap">
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="6"
              placeholder="Your password"
            >
            <button
              type="button"
              class="password-toggle"
              data-password-toggle="login-password"
              aria-label="Show password"
            >Show</button>
          </div>
        </div>

        <label class="auth-check">
          <input type="checkbox" name="remember" checked>
          <span>Keep me signed in on this device</span>
        </label>

        <p class="field-error auth-form-error" id="login-error" role="alert" aria-live="polite"></p>
        <button class="button auth-submit" type="submit">Log in</button>
      </form>

      <p class="auth-switch">
        Don’t have an account?
        <a data-auth-switch href="signup.html">Sign up</a>
      </p>

      <p class="auth-demo-note">
        Demo resident: resident@serbisyomo.demo / Resident123!<br>
        Demo provider: provider@serbisyomo.demo / Provider123!
      </p>
    </div>
  </main>
</body>
</html>
